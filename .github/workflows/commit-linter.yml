name: Commit Linter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commit-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            registry.yarnpkg.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install commitlint
        run: |
          npm ci --prefer-offline --no-audit --ignore-scripts 2>/dev/null || \
          npm install -g @commitlint/cli@19.3.0 @commitlint/config-conventional@19.2.2 --ignore-scripts

      - name: Validate commitlint config
        run: npx commitlint --help > /dev/null

      # Check only incoming commits. Legacy history predates the conventional-commit policy.
      - name: Lint incoming commits
        id: lint
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Cannot establish a trusted commit range"
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          npx commitlint --from="$BASE_SHA" --to="$HEAD_SHA" --verbose

      - name: Report lint results
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" == "failure" ]; then
            echo "::error::Commit lint failed. Please fix commit messages to follow conventional commits format."
            echo "See: https://www.conventionalcommits.org/en/v1.0.0/"
            exit 1
          else
            echo "✅ All commit messages follow conventional commits format"
          fi

  validate-conventional:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: lint
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install commitlint
        run: npm ci --prefer-offline --no-audit --ignore-scripts 2>/dev/null || npm install -g @commitlint/cli@19.3.0 @commitlint/config-conventional@19.2.2 --ignore-scripts

      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "PR Title: $TITLE"
          if ! echo "$TITLE" | grep -qE '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\(.+\))?: .+'; then
            echo "::error::PR title must follow conventional commits format: <type>(<scope>): <description>"
            echo "Example: feat(auth): add login endpoint"
            exit 1
          fi

      - name: Check commit messages in PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          npx commitlint --from="$BASE_SHA" --to="$HEAD_SHA" --verbose

      - name: Add PR label if conventional
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['conventional-commits']
            });
        continue-on-error: true

      - name: Remove label if not conventional
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'conventional-commits'
            }).catch(error => {
              if (error.status !== 404) throw error;
            });
        continue-on-error: true
