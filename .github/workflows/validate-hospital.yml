name: Validate Vex Hospital

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.13"
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python-version: ${{ steps.setup-python.outputs.python-version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            test.pypi.org:443
            pypi.fury.io:443
            objects.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
          allow-prereleases: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir -r requirements.txt
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: 1
          PIP_NO_CACHE_DIR: 0

      - name: Verify critical dependencies
        run: |
          python -c "import yaml, jsonschema, hypothesis, ruff, mypy; print('All critical deps available')"

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Run ruff (lint)
        run: ruff check scripts/ tests/ --output-format=github
        continue-on-error: false

      - name: Run ruff (format check)
        run: ruff format --check scripts/ tests/ --output-format=github
        continue-on-error: false

      - name: Run mypy (type check)
        run: mypy scripts/ tests/ --strict --show-error-codes --pretty
        continue-on-error: false

      - name: Run bandit (security lint)
        run: bandit -r scripts/ tests/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload bandit results
        if: always()
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8
        with:
          sarif_file: bandit-report.json
          category: bandit

  validate:
    name: Validate Hospital Protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, lint]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Validate Hospital Protocol
        run: python scripts/validate_hospital.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Validate Doc Sync
        run: python scripts/validate_doc_sync.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Build conditions registry
        run: python scripts/build_conditions.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Verify registry integrity
        run: |
          python -c "
          import json
          with open('protocol/conditions.json') as f:
              data = json.load(f)
          assert 'conditions' in data and 'facts' in data
          print(f'Conditions: {len(data[\"conditions\"])}, Facts: {len(data[\"facts\"])}')
          "

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, lint]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v --buffer
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONHASHSEED: random

      - name: Generate coverage report
        run: |
          python -m pip install --no-cache-dir coverage
          coverage run -m unittest discover -s tests
          coverage xml -o coverage.xml
          coverage report --show-missing
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, lint]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Run integration tests
        run: python -m unittest tests.test_full_journey -v
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONHASHSEED: random

      - name: Run schema evolution tests
        run: python -m unittest tests.test_schema_evolution -v
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONHASHSEED: random

      - name: Run property-based tests
        run: python -m pytest tests/test_transition_property.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONHASHSEED: random
        continue-on-error: true

  self-examination:
    name: Self-Examination (Mutation Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [setup, lint]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Run mutation tests
        run: python -m unittest tests.test_validator_mutations -v
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONHASHSEED: random

      - name: Verify all mutations caught
        run: |
          python -c "
          import unittest
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromName('tests.test_validator_mutations')
          test_names = [test._testMethodName for test in suite]
          expected = 12
          actual = len(test_names)
          assert actual >= expected, f'Expected at least {expected} mutation tests, got {actual}'
          print(f'Mutation tests: {actual} (expected >= {expected})')
          "

  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, lint]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Run property-based tests
        run: python -m pytest tests/test_transition_property.py -v --tb=short --hypothesis-show-statistics
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONHASHSEED: random

      - name: Run with increased examples
        run: |
          python -m pytest tests/test_transition_property.py::test_transition_policy_no_crash -v --hypothesis-max-examples=200
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONHASHSEED: random

  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog (secret scan)
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --json --fail
        continue-on-error: true

      - name: Run detect-secrets
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
      - run: |
          pip install detect-secrets
          detect-secrets scan --all-files --exclude-files '\.gitignore$' --baseline .secrets.baseline
        continue-on-error: true

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format=json --output=pip-audit.json || true
        continue-on-error: true

      - name: Upload pip-audit results
        if: always()
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8
        with:
          sarif_file: pip-audit.json
          category: pip-audit

      - name: Run safety (known vulnerabilities)
        run: |
          pip install safety
          safety check -r requirements.txt --json --output safety-report.json || true
        continue-on-error: true

      - name: Upload safety results
        if: always()
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8
        with:
          sarif_file: safety-report.json
          category: safety

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, validate, test, integration, self-examination, property-tests, security-scan]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all required jobs passed
        run: |
          echo "All validation jobs completed successfully"
          exit 0

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, validate, test, integration, self-examination, property-tests, security-scan]
    if: failure()
    permissions:
      contents: read
    steps:
      - name: Notify on failure
        run: |
          echo "::error::Validation pipeline failed. Check workflow logs for details."
          echo "Failed jobs: ${{ needs.*.result }}"
        continue-on-error: true