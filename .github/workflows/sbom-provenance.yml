name: SBOM & Provenance

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write
  security-events: write

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hashes: ${{ steps.subject.outputs.hashes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            registry.npmjs.org:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate Python SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: sbom-python.spdx.json
          package-version: ${{ github.sha }}
          include-dev: true

      - name: Generate Node.js SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: sbom-node.spdx.json
          package-version: ${{ github.sha }}
          include-dev: true

      - name: Merge SBOMs
        run: |
          python -c "
          import json
          with open('sbom-python.spdx.json') as f:
              python_sbom = json.load(f)
          with open('sbom-node.spdx.json') as f:
              node_sbom = json.load(f)
          
          merged_packages = python_sbom.get('packages', []) + node_sbom.get('packages', [])
          
          seen = {}
          for pkg in merged_packages:
              key = (pkg.get('name'), pkg.get('versionInfo'))
              if key not in seen:
                  seen[key] = pkg
          
          python_sbom['packages'] = list(seen.values())
          python_sbom['creationInfo']['created'] = '${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}'
          python_sbom['creationInfo']['creators'] = ['Tool: anchore/sbom-action', 'Organization: vessaxor-spec']
          
          with open('sbom.spdx.json', 'w') as f:
              json.dump(python_sbom, f, indent=2)
          print(f'Merged SBOM: {len(python_sbom[\"packages\"])} packages')
          "

      - name: Validate SBOM
        run: |
          python -c "
          import json
          with open('sbom.spdx.json') as f:
              sbom = json.load(f)
          assert 'spdxVersion' in sbom
          assert 'packages' in sbom
          assert len(sbom['packages']) > 0
          print(f'SBOM valid: {len(sbom[\"packages\"])} packages')
          "

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Prepare SLSA subject hash
        id: subject
        run: echo "hashes=$(sha256sum sbom.spdx.json | base64 -w0)" >> "$GITHUB_OUTPUT"

  slsa-provenance:
    name: SLSA Provenance
    needs: sbom
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: ${{ needs.sbom.outputs.hashes }}
      provenance-name: vex-hospital-sbom.intoto.jsonl
      upload-assets: false

  sigstore-sign:
    name: Sigstore Signing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sbom
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download SBOM from build job
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: sbom

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v2.4.1'

      - name: Sign SBOM (keyless)
        run: |
          cosign sign-blob \
            --yes \
            --bundle=sbom-bundle.json \
            --output-signature=sbom.sig \
            --output-certificate=sbom.pem \
            sbom.spdx.json
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Verify signature
        run: |
          cosign verify-blob \
            --bundle=sbom-bundle.json \
            --certificate-identity-regexp=".*" \
            --certificate-oidc-issuer-regexp=".*" \
            sbom.spdx.json
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-sbom
          path: |
            sbom.spdx.json
            sbom.sig
            sbom.pem
            sbom-bundle.json
          retention-days: 90

  attestation:
    name: Generate Attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [sbom, slsa-provenance, sigstore-sign]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download SBOM from build job
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: sbom

      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: sbom.spdx.json