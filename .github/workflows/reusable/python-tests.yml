name: Reusable Python Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        type: string
        default: '3.13'
        required: false
      cache-dependency-path:
        description: 'Path to requirements file for caching'
        type: string
        default: 'requirements.txt'
        required: false
      test-path:
        description: 'Path to test directory'
        type: string
        default: 'tests'
        required: false
      test-pattern:
        description: 'Test file pattern'
        type: string
        default: 'test_*.py'
        required: false
      extra-args:
        description: 'Extra pytest/unittest arguments'
        type: string
        default: '-v --buffer'
        required: false
    outputs:
      test-result:
        description: 'Test result (passed/failed)'
        value: ${{ steps.run-tests.outputs.result }}
    secrets:
      PYPI_TOKEN:
        description: 'PyPI token for publishing'
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            test.pypi.org:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          allow-prereleases: false

      - name: Install dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: 1
          PIP_NO_CACHE_DIR: 0
          CACHE_DEPENDENCY_PATH: ${{ inputs.cache-dependency-path }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir -r "$CACHE_DEPENDENCY_PATH"
          python -m pip install --no-cache-dir pytest pytest-cov hypothesis

      - name: Run tests
        id: run-tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONHASHSEED: random
          TEST_PATH: ${{ inputs.test-path }}
          TEST_PATTERN: ${{ inputs.test-pattern }}
          EXTRA_ARGS: ${{ inputs.extra-args }}
        run: |
          python - <<'PY'
          import os
          import shlex
          import subprocess
          import sys

          command = [
              sys.executable, "-m", "pytest",
              os.environ["TEST_PATH"],
              "-k", os.environ["TEST_PATTERN"],
              *shlex.split(os.environ["EXTRA_ARGS"]),
              "--tb=short", "--junitxml=test-results.xml",
              "--cov=scripts", "--cov=tests",
              "--cov-report=xml:coverage.xml", "--cov-report=term-missing",
          ]
          result = subprocess.run(command, check=False)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"result={'passed' if result.returncode == 0 else 'failed'}\n")
          raise SystemExit(result.returncode)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        if: always() && github.event_name != 'pull_request'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload SARIF (if any)
        if: always()
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8
        with:
          sarif_file: bandit-report.json
          category: bandit
        continue-on-error: true