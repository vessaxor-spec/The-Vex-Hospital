name: One-time CI style repair

on:
  push:
    branches: [fix/ci-trust-and-v2-tracker-20261107]
    paths:
      - .github/workflows/ci-style-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/fix/ci-trust-and-v2-tracker-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/ci-trust-and-v2-tracker-20261107
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.10

      - name: Apply safe automatic Ruff edits and format
        run: |
          ruff check scripts/ tests/ --fix --exit-zero
          ruff format scripts/ tests/
          git diff --check
          git diff --stat

      - name: Commit style-only changes to repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ tests/
          if git diff --cached --quiet; then
            echo "No formatting edits required"
          else
            git commit -m "style: Apply safe Ruff fixes and formatting"
            git push origin HEAD:fix/ci-trust-and-v2-tracker-20261107
          fi
