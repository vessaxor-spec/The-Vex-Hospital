target-version = "py313"
line-length = 100
[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "TRY", # tryceratops
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "ERA", # eradicate
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by line-length)
    "TRY003", # avoid specifying long messages outside the exception class
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[lint.isort]
known-first-party = ["scripts", "tests"]

[lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
# Pytest assertion-style rules do not apply to unittest.TestCase methods.
"tests/test_behavioral_evaluator.py" = ["PT009", "PT027", "PT017"]
"tests/test_evidence_provenance.py" = ["PT009", "PT027", "PT017"]
"tests/test_full_journey.py" = ["PT009", "PT027", "PT017"]
"tests/test_live_trial_harness.py" = ["PT009", "PT027", "PT017"]
"tests/test_privacy_scanner.py" = ["PT009", "PT027", "PT017"]
"tests/test_schema_evolution.py" = ["PT009", "PT027", "PT017"]
"tests/test_transition_policy.py" = ["PT009", "PT027", "PT017"]
"tests/test_validator_mutations.py" = ["PT009", "PT027", "PT017"]
